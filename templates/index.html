<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Eligibility Checker</title>
    <!-- Links your CSS file from the static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Scholarship Eligibility Checker</h2>
            <p class="subtitle">Please enter your details below to check if you qualify.</p>
            
            <!-- Form sends data via POST to your Python app -->
            <form action="/" method="POST">
                 <div class="form-group">
                    <label for="name">Name</label>
                    <input type="string" id="name" name="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" required placeholder="Enter your age">
                </div>

                <div class="form-group">
                    <label for="marks">Marks in Last Passed Exam (%)</label>
                    <input type="number" step="0.01" id="marks" name="marks" required placeholder="e.g., 75">
                </div>

                <div class="form-group">
                    <label for="income">Family Income ($ / ₹)</label>
                    <input type="number" id="income" name="income" required placeholder="Enter family income">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select your category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Check Eligibility</button>
            </form>

            {% if result %}
            <div class="result-box" style="margin-top: 20px; text-align: center;">
                <p style="font-size: 16px; font-weight: bold;">{{ result }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
